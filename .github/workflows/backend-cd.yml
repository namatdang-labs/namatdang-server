name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      AWS_REGION: ap-northeast-2
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate deployment settings
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$EC2_HOST"
          test -n "$EC2_SECURITY_GROUP_ID"
          test -n "$EC2_SSH_USER"
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"

      - name: Download CI deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: namatdang-release.tar
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          tar -xf namatdang-release.tar \
            namatdang-api.tar.gz \
            namatdang-api.tar.gz.sha256
          sha256sum --check namatdang-api.tar.gz.sha256

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Prepare SSH credentials
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy-key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 \
            "$RUNNER_TEMP/ssh/deploy-key" \
            "$RUNNER_TEMP/ssh/known_hosts"

      - name: Temporarily allow SSH from this runner
        id: allow-ssh
        shell: bash
        env:
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          set -Eeuo pipefail

          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]

          rule_id=""
          cleanup_authorization_on_error() {
            if [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]; then
              aws ec2 revoke-security-group-ingress \
                --group-id "$EC2_SECURITY_GROUP_ID" \
                --security-group-rule-ids "$rule_id" \
                >/dev/null
            fi
          }
          trap cleanup_authorization_on_error ERR

          rule_id="$(aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$runner_ip/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"

          [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"
          trap - ERR

      - name: Copy image and deploy to EC2
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
        run: |
          set -Eeuo pipefail

          ssh_key="$RUNNER_TEMP/ssh/deploy-key"
          known_hosts="$RUNNER_TEMP/ssh/known_hosts"
          remote_tar="/tmp/namatdang-release-${DEPLOY_SHA}.tar"
          release_dir="/opt/namatdang/releases/${DEPLOY_SHA}"
          ssh_target="${EC2_SSH_USER}@${EC2_HOST}"

          scp \
            -i "$ssh_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            namatdang-release.tar \
            "${ssh_target}:${remote_tar}"

          ssh \
            -i "$ssh_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$ssh_target" \
            "trap 'sudo rm -f ${remote_tar}' EXIT; \
             sudo install -d -o root -g root -m 0755 ${release_dir}; \
             sudo tar -xf ${remote_tar} -C ${release_dir}; \
             sudo bash ${release_dir}/deploy/deploy.sh ${DEPLOY_SHA} ${release_dir}"

      - name: Revoke temporary SSH access
        if: always() && steps.allow-ssh.outcome == 'success'
        shell: bash
        env:
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          SECURITY_GROUP_RULE_ID: ${{ steps.allow-ssh.outputs.rule_id }}
        run: |
          set -Eeuo pipefail

          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SECURITY_GROUP_RULE_ID" \
            >/dev/null
