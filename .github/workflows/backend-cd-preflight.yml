name: Backend CD Preflight

on:
  push:
    branches:
      - chore/backend-ci

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_REGION: ap-northeast-2

    steps:
      - name: Validate preflight settings
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_DEPLOY_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/namatdang-github-deploy-role" ]]
          [[ "$EC2_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]+$ ]]
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_USER"
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsPreflight-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify assumed AWS account
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail

          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$AWS_ACCOUNT_ID"

      - name: Prepare SSH credentials
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy-key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 \
            "$RUNNER_TEMP/ssh/deploy-key" \
            "$RUNNER_TEMP/ssh/known_hosts"

      - name: Temporarily allow SSH from this runner
        id: allow-ssh
        shell: bash
        env:
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          set -Eeuo pipefail

          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]

          rule_id=""
          cleanup_authorization_on_error() {
            if [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]; then
              aws ec2 revoke-security-group-ingress \
                --group-id "$EC2_SECURITY_GROUP_ID" \
                --security-group-rule-ids "$rule_id" \
                >/dev/null
            fi
          }
          trap cleanup_authorization_on_error ERR

          rule_id="$(aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$runner_ip/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"

          [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"
          trap - ERR

      - name: Verify SSH connection
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$RUNNER_TEMP/ssh/deploy-key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "${EC2_SSH_USER}@${EC2_HOST}" \
            true

      - name: Revoke temporary SSH access
        if: always() && steps.allow-ssh.outcome == 'success'
        shell: bash
        env:
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          SECURITY_GROUP_RULE_ID: ${{ steps.allow-ssh.outputs.rule_id }}
        run: |
          set -Eeuo pipefail

          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SECURITY_GROUP_RULE_ID" \
            >/dev/null
