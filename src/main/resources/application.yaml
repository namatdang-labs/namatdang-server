spring:
  application:
    name: namatdang

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/namatdang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace